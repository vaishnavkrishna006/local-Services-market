version: '3.9'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend

  backend:
    image: php:8.2-apache
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      SQLITE_PATH: /var/www/html/storage/app.db
      APP_ENV: production
      SESSION_SECURE: "false"
    command: >-
      bash -c "apt-get update && apt-get install -y libsqlite3-dev && docker-php-ext-install pdo_sqlite && apache2ctl -D FOREGROUND"
