services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_SERVER_URL: http://backend:80
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: local_services_marketplace
    depends_on:
      - backend

  backend:
    image: php:8.2-apache
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      SQLITE_PATH: /var/www/html/storage/app.db
      APP_ENV: production
      SESSION_SECURE: "false"
    command: >-
      bash -c "apt-get update && apt-get install -y libsqlite3-dev && docker-php-ext-install pdo_sqlite && apache2ctl -D FOREGROUND"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
